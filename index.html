<style>
:root{--bg:#F4E9EC;--card:#FBE3EB;--tx:#3b2a31;--mu:#8c7078;--ac:#8a6472;--bd:#EFD6DA;--ok:#2e9e6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f24;--card:#3a2a31;--tx:#F4E9EC;--mu:#BEACB4;--ac:#8a6472;--bd:#4d3a42;--ok:#4cc58f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1f24;--card:#3a2a31;--tx:#F4E9EC;--mu:#BEACB4;--ac:#8a6472;--bd:#4d3a42;--ok:#4cc58f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:110px}
header{padding:14px 16px 4px}h1{margin:0;font-size:22px}
main{padding:8px 14px;max-width:640px;margin:auto}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;background:color-mix(in srgb,var(--card) 38%,transparent);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.5);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.2);border-radius:28px;padding:6px;z-index:5;max-width:616px;margin:auto}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0 6px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:10.5px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--tx);font-weight:600;background:color-mix(in srgb,var(--tx) 13%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.15)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:20px;padding:5px 12px;font:inherit;font-size:13px}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
h2{font-size:17px;margin:18px 0 4px}h3{font-size:15px;margin:0 0 6px}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.th{width:44px;height:60px;border-radius:6px;background:var(--bd);object-fit:cover;flex:none}
.grow{flex:1;min-width:0}.nm{font-weight:600;overflow-wrap:anywhere}.mu{color:var(--mu);font-size:12px}
.tag{font-size:11px;background:var(--bd);border-radius:20px;padding:1px 8px;margin-right:4px}
select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px;width:100%}
.chg{display:flex;gap:8px;margin:6px 0}.chg label{flex:1;font-size:12px;color:var(--mu)}
button.pri{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600}
button.sec{background:var(--bd);color:var(--tx);border:0;border-radius:10px;padding:10px 14px;font:inherit}
.fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;z-index:6;box-shadow:0 4px 14px #0004}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--bd)}
.big{font-size:30px;font-weight:800;color:var(--tx)}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--bd)}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}
#modal.on{display:flex}
#sheet{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}
#sheet label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px;width:100%;resize:vertical}
input,select,textarea{font-size:16px!important}html{overflow-x:hidden;-webkit-text-size-adjust:100%}body{touch-action:manipulation;overflow-x:hidden}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.ch{border:1px solid var(--bd);background:var(--bg);color:var(--mu);border-radius:20px;padding:5px 12px;font:inherit;font-size:13px}.ch.on{background:var(--ac);color:#fff;border-color:var(--ac)}.addr{display:flex;gap:6px}.addr .sec{padding:6px 14px}
body{font-family:Outfit,system-ui,-apple-system,sans-serif}
h1{font-family:"Jheri Curls",Parisienne,cursive;font-weight:400;font-size:44px;line-height:1.3;margin:0}h2{font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-weight:700;font-style:italic;font-size:28px;letter-spacing:.3px}
h3{font-family:Playball,Parisienne,cursive;font-weight:400;font-size:21px;letter-spacing:.2px}
.nm{font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-weight:700;font-size:19px;line-height:1.15}
.big{font-family:"Cormorant Garamond",Georgia,serif;font-size:46px;font-weight:700}
.empty{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-style:normal;font-size:22px;line-height:1.4}
.kv b{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px}
:root{--gb:rgba(255,255,255,.65)}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--gb:rgba(255,255,255,.14)}}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.6;animation:float 18s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:300px;height:300px;background:#E8C4C8;top:-60px;left:-80px}
.bgfx i:nth-child(2){width:260px;height:260px;background:#fff;top:38%;right:-90px;animation-delay:-6s}
.bgfx i:nth-child(3){width:280px;height:280px;background:#BEACB4;opacity:.45;bottom:-80px;left:8%;animation-delay:-12s}
@keyframes float{to{transform:translate(40px,60px) scale(1.18)}}
.card{background:color-mix(in srgb,var(--card) 55%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--gb);box-shadow:0 8px 28px rgba(0,0,0,.08),inset 0 1px 0 var(--gb);border-radius:22px}
#sheet{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border-top:1px solid var(--gb);border-radius:26px 26px 0 0}
#modal{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button.pri,.btn{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 65%,#fff));box-shadow:0 6px 16px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.35)}
.btn{display:inline-block;color:#fff;border-radius:12px;padding:10px 14px;text-decoration:none;font-weight:600;font-size:14px}
button.sec{background:color-mix(in srgb,var(--bd) 70%,transparent);border:1px solid var(--gb)}
.chips button,.ch{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px}
.tag{display:inline-block;white-space:nowrap;margin:0!important;font-size:11px;padding:2px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chg{display:none!important}
nav{gap:0}nav button{font-size:10px}
.sg{margin:8px 0}.sg label{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px}.sg .sh{border-bottom:1px solid var(--bd)}.sg input{width:20px;height:20px;padding:0;accent-color:var(--ac);flex:none}
.pb{position:relative;height:6px;border-radius:6px;background:var(--bd);margin:20px 26px 34px}
.pb b{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--mu),var(--ac));animation:fill 1.2s cubic-bezier(.2,.8,.2,1) both}
.pb u{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--card);border:2px solid var(--bd);text-decoration:none;transition:.5s}
.pb u.on{background:var(--ac);border-color:var(--ac)}.pb u.cur{animation:pulse 1.8s infinite}
.pb u span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--mu);white-space:nowrap}
@keyframes fill{from{width:0}}@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 50%,transparent)}100%{box-shadow:0 0 0 12px transparent}}

</style></head><body><div class="bgfx"><i></i><i></i><i></i></div>
<header><h1 id="ttl">Mis pedidos</h1></header>
<main id="v"></main>
<button class="pri fab" id="fab" onclick="add()">+</button>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target==this)closeM()"><div id="sheet"></div></div>
<script>
const KEY="pedidos-v1",PAISES=["México","Corea","Japón","Otro"],TIPOS=["PC","Álbum","Otro","Papelería"],
ESTADOS=["Pendiente","Comprado","En camino","En aduana","En casa"];
let S={items:[],boxes:{},prev:0,wish:[],cargos:[],envios:[]},tab="ped",cur=null,img="",gf="",anim=true;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("No se pudo guardar: probablemente hay demasiadas imágenes. Exporta un respaldo.")}}
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+(Math.round(n*100)/100).toLocaleString("es-MX");
const ic=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const TABS=[["ped",ic('<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'),"Pedidos"],["book",ic('<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>'),"Collect Book"],["sin",ic('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),"Sin caja"],["gas",ic('<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h16V9H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1"/>'),"Gastos"]];
function go(t){tab=t;anim=true;render()}
function thumb(i){return i.img?`<img class="th" src="${i.img}">`:`<div class="th"></div>`}
function itemRow(i){return `<div class="row"><div onclick="view('${i.id}')">${thumb(i)}</div><div class="grow" onclick="view('${i.id}')"><div class="nm">${esc(i.name)}</div><div class="mu tags"><span class="tag">${i.type}</span>${i.grupo?`<span class="tag">${esc(i.grupo)}</span>`:""}${(i.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}${i.price?money(i.price):""}</div></div>
<select style="width:112px" onchange="setSt('${i.id}',this.value)">${ESTADOS.map(e=>`<option ${e==i.status?"selected":""}>${e}</option>`).join("")}</select></div>`}
TABS[1][2]="Collect";TABS.splice(2,0,["wish",ic('<path d="M12 20.5s-8-5-8-10.7A4.4 4.4 0 0 1 12 7a4.4 4.4 0 0 1 8 2.8c0 5.7-8 10.7-8 10.7z"/>'),"Wishlist"]);
TABS.splice(4,0,["env",ic('<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.6"/><circle cx="17" cy="17.5" r="1.6"/>'),"Envíos"]);
function grupos(){return [...new Set(S.items.concat(S.wish||[]).map(i=>i.grupo).filter(Boolean))].sort()}
function setG(k){gf=k<0?"":grupos()[k];render()}
function chips(){const g=grupos();if(!g.length)return"";return `<div class="chips"><button class="${gf?"":"on"}" onclick="setG(-1)">Todos</button>${g.map((x,k)=>`<button class="${x==gf?"on":""}" onclick="setG(${k})">${esc(x)}</button>`).join("")}</div>`}
function setSt(id,v){S.items.find(i=>i.id==id).status=v;save()}
function setCh(k,f,v){S.boxes[k]=S.boxes[k]||{};S.boxes[k][f]=parseFloat(v)||0;save()}
function render(){
 $("nav").innerHTML=TABS.map(t=>`<button class="${t[0]==tab?"on":""}" onclick="go('${t[0]}')">${t[1]}<span>${t[2]}</span></button>`).join("");
 $("ttl").textContent=(tab=="book"?"Collect Book":TABS.find(t=>t[0]==tab)[2]).normalize("NFD").replace(/[\u0300-\u036f]/g,"");$("fab").style.display="";
 let h="";
 if(tab=="ped"){
  const withBox=S.items.filter(i=>(i.box||i.country=="México")&&(!gf||i.grupo==gf));
  if(!withBox.length)h=`<div class="empty">Aún no hay pedidos con caja.<br>Toca + para agregar el primero.</div>`;
  PAISES.forEach(p=>{const its=withBox.filter(i=>i.country==p);if(!its.length)return;
   h+=`<h2>${p}</h2>`;
   [...new Set(its.map(i=>i.box))].sort((a,b)=>a.localeCompare(b,"es",{numeric:true})).forEach(b=>{
    const k=p+"|"+b,c=S.boxes[k]||{},bi=its.filter(i=>i.box==b);
    h+=`<div class="card"><h3>${b?"Caja "+esc(b):"Compras en México"} · ${bi.length} artículo${bi.length>1?"s":""}</h3>${bi.map(itemRow).join("")}
    <div class="chg"${b?"":' style="display:none"'}><label>Envío a México<input type="number" inputmode="decimal" value="${c.ship||""}" onchange="setCh('${esc(k)}','ship',this.value)"></label>
    <label>Aduana<input type="number" inputmode="decimal" value="${c.customs||""}" onchange="setCh('${esc(k)}','customs',this.value)"></label></div></div>`})});
 }
 if(tab=="book"){
  const pcs=S.items.filter(i=>i.type=="PC"&&(!gf||i.grupo==gf));
  const cell=i=>`<div onclick="view('${i.id}')">${i.img?`<img src="${i.img}">`:`<img alt="">`}<div class="mu" style="text-align:center">${esc(i.name)}</div></div>`;
  h=pcs.length?[...new Set(pcs.map(i=>i.grupo||"Sin grupo"))].sort().map(g=>`<h2>${esc(g)}</h2><div class="grid">${pcs.filter(i=>(i.grupo||"Sin grupo")==g).map(cell).join("")}</div>`).join(""):`<div class="empty">Agrega photocards con foto y aparecerán aquí.</div>`;
  h=`<div class="mu">${pcs.length} photocards</div>`+h;
 }
 if(tab=="sin"){
  const s=S.items.filter(i=>!i.box&&i.country!="México"&&(!gf||i.grupo==gf));
  h=`<div class="mu">Artículos que aún no tienen caja asignada (preventas, sin fecha, etc.). Edítalos para asignar caja.</div><div class="card">${s.length?s.map(itemRow).join(""):`<div class="empty">Nada pendiente por asignar.</div>`}</div>`;
 }
 if(tab=="wish"){
  const w=S.wish.filter(i=>!gf||i.grupo==gf);
  const cell=i=>`<div onclick="viewW('${i.id}')">${i.img?`<img src="${i.img}">`:`<img alt="">`}<div class="nm" style="font-size:16px;text-align:center">${esc(i.name)}</div>${i.det?`<div class="mu" style="text-align:center">${esc(i.det)}</div>`:""}</div>`;
  h=w.length?`<div class="mu">${w.length} deseadas</div>`+[...new Set(w.map(i=>i.grupo||"Sin grupo"))].sort().map(g=>`<h2>${esc(g)}</h2><div class="grid">${w.filter(i=>(i.grupo||"Sin grupo")==g).map(cell).join("")}</div>`).join(""):`<div class="empty">Tu wishlist está vacía.<br>Toca + para agregar una photocard que deseas.</div>`;
 }
 if(tab=="env"){
  h=S.envios.length?S.envios.map(e=>{const u=e.upd[e.upd.length-1];return `<div class="card"><div style="display:flex;align-items:center;gap:8px"><div class="grow"><div class="nm">${esc(e.carr)} · ${esc(e.guia)}</div><div class="mu">${e.ids.length} artículo${e.ids.length==1?"":"s"}</div></div><button class="sec" aria-label="Editar" onclick="editE('${e.id}')" style="padding:8px 10px">${PEN}</button></div>
  <div class="pb"><b style="width:${e.stage*25}%"></b>${STAGES.map((s,k)=>`<u class="${k<=e.stage?"on":""} ${k==e.stage?"cur":""}" style="left:${k*25}%"><span>${s}</span></u>`).join("")}</div>
  <div class="mu">${u?esc(u.n)+" · "+u.t:"Sin actualizaciones todavía"}</div>
  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><a class="btn" href="${trk(e.carr,e.guia)}" target="_blank" rel="noopener">Rastrear</a><button class="sec" onclick="updE('${e.id}')">Actualizar</button><button class="sec" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(e.guia)}')">Copiar guía</button></div></div>`}).join(""):`<div class="empty">Sin envíos todavía.<br>Toca + para agregar una guía.</div>`;
 }
 if(tab=="gas"){
  const prod=S.items.reduce((a,i)=>a+(+i.price||0),0),bx=Object.values(S.boxes),cg=k=>S.cargos.filter(c=>c.kind==k).reduce((a,c)=>a+c.amt,0),
  ship=bx.reduce((a,b)=>a+(b.ship||0),0)+cg("mx"),cus=bx.reduce((a,b)=>a+(b.customs||0),0)+cg("adu"),nac=cg("nac"),tot=S.prev+prod+ship+cus+nac;
  h=`<div class="card"><div class="mu">Total gastado</div><div class="big">${money(tot)}</div></div>
  <div class="card"><div class="kv"><span>Productos (con precio)</span><b>${money(prod)}</b></div>
  <div class="kv"><span>Envíos a México</span><b>${money(ship)}</b></div>
  <div class="kv"><span>Aduanas</span><b>${money(cus)}</b></div>
  <div class="kv"><span>Envíos nacionales</span><b>${money(nac)}</b></div>
  <label class="mu" style="display:block;margin-top:8px">Gasto previo (antes de usar la app)<input type="number" inputmode="decimal" value="${S.prev||""}" onchange="S.prev=parseFloat(this.value)||0;save();render()"></label></div>
  <h2>Cargos de envío y aduana</h2><div class="card">${cargosHtml()}</div>
  <h2>Por país (productos)</h2><div class="card">${PAISES.map(p=>`<div class="kv"><span>${p}</span><b>${money(S.items.filter(i=>i.country==p).reduce((a,i)=>a+(+i.price||0),0))}</b></div>`).join("")}</div>
  <h2>Respaldo</h2><div class="card"><button class="sec" onclick="exp()">Exportar respaldo</button> <button class="sec" onclick="$('imp').click()">Importar</button><input type="file" id="imp" accept=".json" hidden onchange="imp(this.files[0])"><div class="mu" style="margin-top:6px">Los datos se guardan en este navegador. Exporta un respaldo de vez en cuando.</div></div>`;
 }
 if(tab!="gas")h=chips()+h;
 $("v").innerHTML=h;$("v").className=anim?"in":"";anim=false;
}
function edit(id){
 cur=id?S.items.find(i=>i.id==id):null;const i=cur||{name:"",type:"PC",country:"Corea",box:"",status:"Pendiente",price:"",img:""};img=i.img||"";fG=i.grupo||"";fT=[...(i.tags||[])];
 const sel=(a,v)=>a.map(x=>`<option ${x==v?"selected":""}>${x}</option>`).join("");
 $("sheet").innerHTML=`<h3>${cur?"Editar":"Nuevo"} artículo</h3>
 <label>Nombre</label><input id="f_n" value="${esc(i.name)}" placeholder="PC Sunoo Olive Young">
 <label>Grupo</label><div id="pw_g">${pickHtml("g")}</div>
 <label>Tags (tienda, POB, etc.)</label><div id="pw_t">${pickHtml("t")}</div>
 <label>Tipo</label><select id="f_t">${sel(TIPOS,i.type)}</select>
 <label>País</label><select id="f_c">${sel(PAISES,i.country)}</select>
 <label>Caja (vacío = sin caja asignada)</label><input id="f_b" value="${esc(i.box)}" inputmode="numeric" placeholder="2">
 <label>Estado</label><select id="f_s">${sel(ESTADOS,i.status)}</select>
 <label>Precio</label><input id="f_p" type="number" inputmode="decimal" value="${i.price||""}">
 <label>Detalles / notas</label><textarea id="f_d" rows="2">${esc(i.det)}</textarea>
 <label>Imagen</label><input type="file" accept="image/*" onchange="pick(this.files[0])"><div id="pv">${img?`<img class="th" style="margin-top:6px" src="${img}">`:""}</div>
 <div style="display:flex;gap:8px;margin-top:14px"><button class="pri" onclick="ok()">Guardar</button><button class="sec" onclick="closeM()">Cancelar</button>${cur?`<button class="sec" style="margin-left:auto" onclick="del()">Borrar</button>`:""}</div>`;
 $("modal").classList.add("on");
}
let fG="",fT=[];const PH={g:"Nuevo grupo",t:"Nuevo tag (ej. Weverse POB)"};
const allG=()=>[...new Set([...(S.glist||[]),...grupos()])].sort();
const allT=()=>[...new Set([...(S.tlist||[]),...S.items.flatMap(i=>i.tags||[])])].sort();
function pickHtml(k){const sel=k=="g"?[fG]:fT,l=k=="g"?allG():allT();return `<div class="pick">${l.map((x,n)=>`<button type="button" class="ch ${sel.includes(x)?"on":""}" onclick="pickC('${k}',${n})">${esc(x)}</button>`).join("")}</div><div class="addr"><input id="nw_${k}" placeholder="${PH[k]}"><button type="button" class="sec" onclick="addC('${k}')">+</button></div>`}
function rp(k){$("pw_"+k).innerHTML=pickHtml(k)}
function pickC(k,n){const x=(k=="g"?allG():allT())[n];if(k=="g")fG=fG==x?"":x;else fT=fT.includes(x)?fT.filter(y=>y!=x):[...fT,x];rp(k)}
function addC(k){const el=$("nw_"+k),v=el.value.trim();if(!v)return;const key=k=="g"?"glist":"tlist";S[key]=S[key]||[];if(!S[key].includes(v))S[key].push(v);if(k=="g")fG=v;else if(!fT.includes(v))fT.push(v);save();rp(k)}
const PEN='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
const hd=(n,c)=>`<div style="display:flex;align-items:center;gap:8px"><h3 style="margin:0;flex:1">${esc(n)}</h3><button class="sec" aria-label="Editar" onclick="${c}" style="padding:8px 10px">${PEN}</button></div>`;
const kv=(a,b)=>b?`<div class="kv"><span>${a}</span><b>${esc(b)}</b></div>`:"";
const pic=i=>i.img?`<img src="${i.img}" style="width:100%;max-height:340px;object-fit:contain;border-radius:12px;margin:10px 0">`:"";
function view(id){const i=S.items.find(x=>x.id==id);if(!i)return;
 $("sheet").innerHTML=hd(i.name,`edit('${i.id}')`)+pic(i)+kv("Grupo",i.grupo)+kv("Tipo",i.type)+kv("País",i.country)+kv("Caja",i.country=="México"?"En casa (sin caja)":i.box?"Caja "+i.box:"Sin asignar")+kv("Estado",i.status)+kv("Precio",i.price?money(i.price):"")+((i.tags||[]).length?`<div style="margin-top:8px">${i.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`:"")+(i.det?`<div class="mu" style="margin-top:8px;white-space:pre-wrap">${esc(i.det)}</div>`:"")+`<div style="margin-top:14px"><button class="sec" onclick="closeM()">Cerrar</button></div>`;
 $("modal").classList.add("on")}
function viewW(id){const i=S.wish.find(x=>x.id==id);if(!i)return;
 $("sheet").innerHTML=hd(i.name,`editW('${i.id}')`)+pic(i)+kv("Grupo",i.grupo)+(i.det?`<div class="mu" style="margin-top:8px;white-space:pre-wrap">${esc(i.det)}</div>`:"")+`<div style="margin-top:14px"><button class="sec" onclick="closeM()">Cerrar</button></div>`;
 $("modal").classList.add("on")}
const KN={mx:"Envío a México",adu:"Aduana",nac:"Envío nacional"},STAGES=["Preparando","Recolectado","En tránsito","En reparto","Entregado"];
const CARR={"Estafeta":0,"DHL":g=>`https://www.dhl.com/mx-es/home/tracking.html?tracking-id=${g}`,"FedEx":g=>`https://www.fedex.com/fedextrack/?trknbr=${g}`,"UPS":g=>`https://www.ups.com/track?tracknum=${g}`,"Redpack":0,"Correos de México":0,"Paquetexpress":0,"J&T Express":0,"99minutos":0,"Otra":0};
const trk=(c,g)=>CARR[c]?CARR[c](encodeURIComponent(g)):`https://t.17track.net/es#nums=${encodeURIComponent(g)}`;
const now=()=>new Date().toLocaleString("es-MX",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const btns=(ok,del)=>`<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="pri" onclick="${ok}()">Guardar</button><button class="sec" onclick="closeM()">Cancelar</button>${cur&&del?`<button class="sec" style="margin-left:auto" onclick="${del}()">Borrar</button>`:""}</div>`;
let selIds=[],selF=()=>true,SG=[],stg=0;
function selHtml(){const gs={};S.items.filter(selF).forEach(i=>{const k=(i.country=="México"&&!i.box)?"México · en casa":i.country+" · Caja "+(i.box||"sin asignar");(gs[k]=gs[k]||[]).push(i)});const ks=Object.keys(gs);SG=ks.map(k=>gs[k].map(i=>i.id));
 if(!ks.length)return '<div class="mu">No hay artículos pendientes.</div>';
 return ks.map((k,n)=>`<div class="sg"><label class="sh"><input type="checkbox" ${SG[n].every(x=>selIds.includes(x))?"checked":""} onchange="togG(${n},this.checked)"><b>${esc(k)}</b></label>${gs[k].map(i=>`<label><input type="checkbox" ${selIds.includes(i.id)?"checked":""} onchange="togI('${i.id}',this.checked)"><span>${esc(i.name)}</span></label>`).join("")}</div>`).join("")}
function togI(id,c){selIds=c?[...new Set([...selIds,id])]:selIds.filter(x=>x!=id);$("selw").innerHTML=selHtml()}
function togG(n,c){SG[n].forEach(id=>{selIds=c?[...new Set([...selIds,id])]:selIds.filter(x=>x!=id)});$("selw").innerHTML=selHtml()}
function openM(h){$("sheet").innerHTML=h;$("modal").classList.add("on")}
function cargosHtml(){return (S.cargos.length?S.cargos.map(c=>`<div class="kv" onclick="editC('${c.id}')"><span>${KN[c.kind]}<div class="mu">${c.ids.length} artículo${c.ids.length==1?"":"s"}${c.note?" · "+esc(c.note):""}</div></span><b>${money(c.amt)}</b></div>`).join(""):`<div class="mu">Aún no hay cargos.</div>`)+`<div style="margin-top:10px"><button class="pri" onclick="editC()">+ Agregar cargo</button></div>`}
function editC(id){cur=id?S.cargos.find(c=>c.id==id):null;const c=cur||{kind:"mx",amt:"",note:"",ids:[]};selIds=[...c.ids];selF=i=>i.status!="En casa"||selIds.includes(i.id);
 openM(`<h3>${cur?"Editar":"Nuevo"} cargo</h3><label>Tipo</label><select id="c_k">${Object.keys(KN).map(k=>`<option value="${k}" ${k==c.kind?"selected":""}>${KN[k]}</option>`).join("")}</select><label>Monto</label><input id="c_a" type="number" inputmode="decimal" value="${c.amt}"><label>Nota (opcional)</label><input id="c_n" value="${esc(c.note)}"><label>Artículos pendientes (elige varios o toda una caja)</label><div id="selw">${selHtml()}</div>${btns("okC","delC")}`)}
function okC(){const a=parseFloat($("c_a").value);if(!a)return alert("Escribe el monto");const o={kind:$("c_k").value,amt:a,note:$("c_n").value.trim(),ids:[...selIds]};if(cur)Object.assign(cur,o);else S.cargos.push(Object.assign({id:String(Date.now())},o));save();closeM();render()}
function delC(){if(confirm("¿Borrar este cargo?")){S.cargos=S.cargos.filter(c=>c!==cur);save();closeM();render()}}
function editE(id){cur=id?S.envios.find(e=>e.id==id):null;const e=cur||{carr:"Estafeta",guia:"",ids:[]};selIds=[...e.ids];selF=i=>i.status!="En casa"||selIds.includes(i.id);
 openM(`<h3>${cur?"Editar":"Nuevo"} envío</h3><label>Paquetería</label><select id="e_c">${Object.keys(CARR).map(k=>`<option ${k==e.carr?"selected":""}>${esc(k)}</option>`).join("")}</select><label>Número de guía</label><input id="e_g" value="${esc(e.guia)}"><label>Artículos en camino</label><div id="selw">${selHtml()}</div>${btns("okE","delE")}`)}
function okE(){const g=$("e_g").value.trim();if(!g)return alert("Escribe la guía");const o={carr:$("e_c").value,guia:g,ids:[...selIds]};if(cur)Object.assign(cur,o);else S.envios.push(Object.assign({id:String(Date.now()),stage:0,upd:[]},o));save();closeM();render()}
function delE(){if(confirm("¿Borrar este envío?")){S.envios=S.envios.filter(e=>e!==cur);save();closeM();render()}}
function updE(id){cur=S.envios.find(e=>e.id==id);stg=cur.stage;
 openM(`<h3>Actualizar envío</h3><div class="mu">${esc(cur.carr)} · ${esc(cur.guia)}</div><label>Etapa</label><div class="pick">${STAGES.map((s,k)=>`<button type="button" class="ch ${k==stg?"on":""}" onclick="stg=${k};document.querySelectorAll('#sheet .ch').forEach((b,j)=>b.classList.toggle('on',j==${k}))">${s}</button>`).join("")}</div><label>Nota de la guía (opcional)</label><input id="u_n" placeholder="Ej. Llegó al centro de distribución"><div style="display:flex;gap:8px;margin-top:14px"><button class="pri" onclick="saveU()">Guardar</button><button class="sec" onclick="closeM()">Cancelar</button></div>`)}
function saveU(){const e=cur;e.stage=stg;e.upd.push({t:now(),n:$("u_n").value.trim()||STAGES[stg]});e.ids.forEach(id=>{const it=S.items.find(x=>x.id==id);if(it)it.status=stg>=4?"En casa":stg>=2?"En camino":it.status});save();closeM();render()}
function add(){tab=="wish"?editW():tab=="env"?editE():tab=="gas"?editC():edit()}
function editW(id){cur=id?S.wish.find(i=>i.id==id):null;const i=cur||{name:"",grupo:"",det:"",img:""};img=i.img||"";fG=i.grupo||"";fT=[...(i.tags||[])];
 $("sheet").innerHTML=`<h3>${cur?"Editar":"Nueva"} photocard deseada</h3>
 <label>Nombre</label><input id="w_n" value="${esc(i.name)}" placeholder="PC Sunoo Weverse Luckydraw">
 <label>Grupo</label><div id="pw_g">${pickHtml("g")}</div>
 <label>Detalles (álbum, regalo de preventa, etc.)</label><textarea id="w_d" rows="3">${esc(i.det)}</textarea>
 <label>Imagen</label><input type="file" accept="image/*" onchange="pick(this.files[0])"><div id="pv">${img?`<img class="th" style="margin-top:6px" src="${img}">`:""}</div>
 <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="pri" onclick="okW()">Guardar</button><button class="sec" onclick="closeM()">Cancelar</button>${cur?`<button class="sec" onclick="toItem()">Ya la pedí</button><button class="sec" style="margin-left:auto" onclick="delW()">Borrar</button>`:""}</div>`;
 $("modal").classList.add("on")}
function okW(){const n=$("w_n").value.trim();if(!n)return alert("Escribe un nombre");const o={name:n,grupo:fG,det:$("w_d").value.trim(),img};
 if(cur)Object.assign(cur,o);else S.wish.push(Object.assign({id:String(Date.now())},o));save();closeM();render()}
function delW(){if(confirm("¿Borrar de la wishlist?")){S.wish=S.wish.filter(i=>i!==cur);save();closeM();render()}}
function toItem(){S.items.push({id:String(Date.now()),name:cur.name,grupo:cur.grupo,type:"PC",country:"Corea",box:"",status:"Pendiente",price:0,img:cur.img});S.wish=S.wish.filter(i=>i!==cur);save();closeM();go("sin")}
function closeM(){$("modal").classList.remove("on")}
function pick(f){if(!f)return;const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const k=Math.min(1,360/Math.max(m.width,m.height)),c=document.createElement("canvas");c.width=m.width*k;c.height=m.height*k;c.getContext("2d").drawImage(m,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",.7);$("pv").innerHTML=`<img class="th" style="margin-top:6px" src="${img}">`};m.src=r.result};r.readAsDataURL(f)}
function ok(){const n=$("f_n").value.trim();if(!n)return alert("Escribe un nombre");
 const o={name:n,grupo:fG,tags:[...fT],det:$("f_d").value.trim(),type:$("f_t").value,country:$("f_c").value,box:$("f_c").value=="México"?"":$("f_b").value.trim(),status:$("f_s").value,price:parseFloat($("f_p").value)||0,img};
 if(cur)Object.assign(cur,o);else S.items.push(Object.assign({id:String(Date.now())},o));
 save();closeM();render()}
function del(){if(confirm("¿Borrar este artículo?")){S.items=S.items.filter(i=>i!==cur);save();closeM();render()}}
function exp(){const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S));a.download="pedidos-respaldo.json";a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign({items:[],boxes:{},prev:0,wish:[],cargos:[],envios:[]},JSON.parse(r.result));save();render()}catch(e){alert("Archivo inválido")}};r.readAsText(f)}
render();
</script></body></html>
