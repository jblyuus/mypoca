<title>mypoca</title>
<style>
:root{--bg:#EAF1FB;--card:#F6F9FF;--tx:#22344d;--mu:#6b84a3;--ac:#4f78b3;--bd:#D3E2F5;--ok:#2e9e6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131b2a;--card:#1e2a40;--tx:#e6eefb;--mu:#9fb4d1;--ac:#4f78b3;--bd:#2f405c;--ok:#4cc58f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131b2a;--card:#1e2a40;--tx:#e6eefb;--mu:#9fb4d1;--ac:#4f78b3;--bd:#2f405c;--ok:#4cc58f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:110px}
header{padding:14px 16px 4px}h1{margin:0;font-size:22px}
main{padding:8px 14px;max-width:640px;margin:auto}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;background:color-mix(in srgb,var(--card) 38%,transparent);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.5);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.2);border-radius:28px;padding:6px;z-index:5;max-width:616px;margin:auto}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0 6px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:10.5px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--tx);font-weight:600;background:color-mix(in srgb,var(--tx) 13%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.15)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:20px;padding:5px 12px;font:inherit;font-size:13px}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
h2{font-size:17px;margin:18px 0 4px}h3{font-size:15px;margin:0 0 6px}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.th{width:44px;height:60px;border-radius:6px;background:var(--bd);object-fit:cover;flex:none}
.grow{flex:1;min-width:0}.nm{font-weight:600;overflow-wrap:anywhere}.mu{color:var(--mu);font-size:12px}
.tag{font-size:11px;background:var(--bd);border-radius:20px;padding:1px 8px;margin-right:4px}
select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px;width:100%}
.chg{display:flex;gap:8px;margin:6px 0}.chg label{flex:1;font-size:12px;color:var(--mu)}
button.pri{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600}
button.sec{background:var(--bd);color:var(--tx);border:0;border-radius:10px;padding:10px 14px;font:inherit}
.fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;z-index:6;box-shadow:0 4px 14px #0004}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--bd)}
.big{font-size:30px;font-weight:800;color:var(--tx)}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--bd)}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}
#modal.on{display:flex}
#sheet{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}
#sheet label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px;width:100%;resize:vertical}
input,select,textarea{font-size:16px!important}html{overflow-x:hidden;-webkit-text-size-adjust:100%}body{touch-action:manipulation;overflow-x:hidden}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.ch{border:1px solid var(--bd);background:var(--bg);color:var(--mu);border-radius:20px;padding:5px 12px;font:inherit;font-size:13px}.ch.on{background:var(--ac);color:#fff;border-color:var(--ac)}.addr{display:flex;gap:6px}.addr .sec{padding:6px 14px}
body{font-family:Outfit,system-ui,-apple-system,sans-serif}
h1{font-family:"Jheri Curls",Parisienne,cursive;font-weight:400;font-size:44px;line-height:1.3;margin:0}h2{font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-weight:700;font-style:italic;font-size:28px;letter-spacing:.3px}
h3{font-family:Playball,Parisienne,cursive;font-weight:400;font-size:21px;letter-spacing:.2px}
.nm{font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-weight:700;font-size:19px;line-height:1.15}
.big{font-family:"Cormorant Garamond",Georgia,serif;font-size:46px;font-weight:700}
.empty{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-style:normal;font-size:22px;line-height:1.4}
.kv b{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px}
:root{--gb:rgba(255,255,255,.65)}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--gb:rgba(255,255,255,.14)}}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.6;animation:float 18s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:300px;height:300px;background:var(--o1);top:-60px;left:-80px}
.bgfx i:nth-child(2){width:260px;height:260px;background:var(--o2);top:38%;right:-90px;animation-delay:-6s}
.bgfx i:nth-child(3){width:280px;height:280px;background:var(--o3);opacity:.5;bottom:-80px;left:8%;animation-delay:-12s}
@keyframes float{to{transform:translate(40px,60px) scale(1.18)}}
.card{background:color-mix(in srgb,var(--card) 55%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--gb);box-shadow:0 8px 28px rgba(0,0,0,.08),inset 0 1px 0 var(--gb);border-radius:22px}
#sheet{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border-top:1px solid var(--gb);border-radius:26px 26px 0 0}
#modal{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button.pri,.btn{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 65%,#fff));box-shadow:0 6px 16px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.35)}
.btn{display:inline-block;color:#fff;border-radius:12px;padding:10px 14px;text-decoration:none;font-weight:600;font-size:14px}
button.sec{background:color-mix(in srgb,var(--bd) 70%,transparent);border:1px solid var(--gb)}
.chips button,.ch{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px}
.tag{display:inline-block;white-space:nowrap;margin:0!important;font-size:11px;padding:2px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chg{display:none!important}
nav{gap:0}nav button{font-size:10px}
.sg{margin:8px 0}.sg label{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px}.sg .sh{border-bottom:1px solid var(--bd)}.sg input{width:20px;height:20px;padding:0;accent-color:var(--ac);flex:none}
.pb{position:relative;height:6px;border-radius:6px;background:var(--bd);margin:20px 26px 34px}
.pb b{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--mu),var(--ac));animation:fill 1.2s cubic-bezier(.2,.8,.2,1) both}
.pb u{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--card);border:2px solid var(--bd);text-decoration:none;transition:.5s}
.pb u.on{background:var(--ac);border-color:var(--ac)}.pb u.cur{animation:pulse 1.8s infinite}
.pb u span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--mu);white-space:nowrap}
@keyframes fill{from{width:0}}@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 50%,transparent)}100%{box-shadow:0 0 0 12px transparent}}

h1{font-family:"Alte Haas Regular",Outfit,sans-serif;font-weight:400;font-size:40px;line-height:1.2;letter-spacing:-.5px}
h2{font-family:"Champagne Limousines",Outfit,sans-serif;font-weight:400;font-style:normal;font-size:26px;letter-spacing:.3px}
h3{font-family:"Alte Haas Regular",Outfit,sans-serif;font-weight:400;font-size:20px;letter-spacing:-.2px}
.nm{font-family:Vividly,Outfit,sans-serif;font-weight:400;font-size:21px;line-height:1.15}
.big,.empty,.kv b{font-family:Outfit,system-ui,sans-serif}.big{font-size:40px;font-weight:700}.empty{font-size:16px;font-weight:500}.kv b{font-size:15px;font-weight:600}
.seg{display:flex;gap:4px;padding:4px;border-radius:18px;background:color-mix(in srgb,var(--card) 50%,transparent);border:1px solid var(--gb);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);margin:8px 0 6px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px 10px;border-radius:14px;font:inherit;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--ac);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}.seg small{opacity:.7}

.avb{width:46px;height:46px;border-radius:50%;border:1px solid var(--gb);padding:0;overflow:hidden;background:color-mix(in srgb,var(--card) 60%,transparent);color:var(--mu);display:flex;align-items:center;justify-content:center;flex:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}.avb img{width:100%;height:100%;object-fit:cover}
header{display:flex;align-items:center;justify-content:space-between}
.pcard{position:relative;border-radius:28px;padding:22px 18px 18px;margin:10px 0;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:0 14px 34px color-mix(in srgb,var(--g1) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.5);overflow:hidden}
.pcard::before{content:"";position:absolute;top:-90px;right:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.25);filter:blur(30px)}
.pav{width:92px;height:92px;border-radius:50%;border:3px solid rgba(255,255,255,.75);overflow:hidden;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:36px;position:relative}.pav img{width:100%;height:100%;object-fit:cover}
.pedit{position:absolute;z-index:3;top:auto;bottom:16px;right:16px;padding:8px 10px!important;color:#fff!important;background:rgba(255,255,255,.22)!important;border-color:rgba(255,255,255,.45)!important}
.pname{font-family:"Alte Haas Regular",Outfit,sans-serif;font-size:28px;margin-top:12px;position:relative}.puser{opacity:.88;font-size:15px;position:relative}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;position:relative}.pchip{background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600}.big2{background:rgba(15,40,90,.35)}

.sw{display:flex;gap:14px 12px;flex-wrap:wrap;margin-bottom:18px}.swi{display:flex;flex-direction:column;align-items:center;gap:6px;width:56px}.swi span{font-size:10.5px;color:var(--mu);white-space:nowrap}.pgear{right:64px!important}.swb{width:46px;height:46px;border-radius:50%;border:3px solid transparent;padding:0;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 8px rgba(0,0,0,.12)}.swb.on{border-color:var(--tx)}.swb span{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mu);white-space:nowrap}
#modal{align-items:center;justify-content:center;padding:22px calc(22px + env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) calc(22px + env(safe-area-inset-left,0px))}
#modal #sheet{border-radius:28px;max-width:400px;max-height:84%;padding-bottom:16px;margin:0;border:1px solid var(--gb);box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 1px 0 var(--gb);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)!important}
.grid.prod{grid-template-columns:repeat(2,1fr);gap:12px}.grid.prod img{aspect-ratio:1/1;object-fit:contain;padding:8px;background:color-mix(in srgb,var(--card) 75%,transparent);border:1px solid var(--gb)}
.grid>div,.mgrid img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.grid img,.mgrid img{-webkit-user-drag:none}
#modal:has(.fm) #sheet{max-width:440px;max-height:90%}
.pvbox{display:flex;align-items:center;justify-content:center;min-height:110px;border:2px dashed var(--bd);border-radius:18px;color:var(--mu);margin:10px 0 8px;background:color-mix(in srgb,var(--bg) 60%,transparent);padding:8px}.pvimg{max-height:170px;max-width:100%;border-radius:12px;display:block}
.sm{padding:6px 12px!important;font-size:13px}
.fs{background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--bd);border-radius:16px;padding:4px 12px 12px;margin:10px 0}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbar{position:sticky;bottom:-10px;display:flex;gap:8px;flex-wrap:wrap;padding:10px;margin-top:12px;border-radius:18px;border:1px solid var(--gb);background:color-mix(in srgb,var(--card) 92%,var(--bg));box-shadow:0 -6px 18px rgba(0,0,0,.07);z-index:2}
#sheet *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.tile{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--bd);display:flex;align-items:center;justify-content:center;border:2px solid transparent;transition:transform .2s,border-color .2s}.tile img{width:100%;height:100%;object-fit:cover}
.tile i{position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.8);border:1.5px solid var(--bd);transition:.2s}.tile.on{border-color:var(--ac);transform:scale(.93)}.tile.on i{background:var(--ac);border-color:var(--ac)}.tile.on i::after{content:"✓";color:#fff;font-size:11px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sgh{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px}.sgh .ch{padding:4px 10px;font-size:12px}
.plv{position:absolute;right:16px;top:16px;width:132px;text-align:right;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);border-radius:16px;padding:10px 12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:1}
.lvt{font-size:13px;font-weight:700;margin-bottom:6px}.xpb{height:8px;border-radius:8px;background:rgba(255,255,255,.3);overflow:hidden}.xpb b{display:block;height:100%;border-radius:8px;background:#fff;animation:fill 1.3s cubic-bezier(.2,.8,.2,1) both}.xpt{font-size:10.5px;opacity:.92;margin-top:5px}
.vw .xpb{background:var(--bd)}.vw .xpb b{background:linear-gradient(90deg,var(--mu),var(--ac))}.ach{margin:9px 0}.achh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.ach.ok .achh span{font-weight:700}
.lvhero{display:flex;gap:14px;align-items:center;margin:6px 0 16px}.lvring{--p:0;width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bd) 0);display:flex;align-items:center;justify-content:center;flex:none}
.lvring>div{width:68px;height:68px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}.lvring small{font-size:9px;letter-spacing:1px;color:var(--mu)}.lvring b{font-size:28px;font-weight:700;margin-top:2px}
.lvname{font-family:"Alte Haas Regular",Outfit,sans-serif;font-size:24px}
.xrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--bd);margin:8px 0}.xic{font-size:22px;width:34px;text-align:center;flex:none}.xn{font-weight:700;font-size:15px}.xr{font-size:12px;color:var(--mu);line-height:1.3}.xv{text-align:right;flex:none}.xv b{display:block;color:var(--ac);font-size:15px}.xv small{font-size:11px;color:var(--mu)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.atile{padding:10px;border-radius:16px;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--bd);text-align:center}.atile.ok{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}.aem{font-size:24px}.atile .an{font-size:12.5px;font-weight:600;margin:4px 0 6px}.atile small{display:block;font-size:10.5px;color:var(--mu);margin-top:5px}
.xic svg,.aem svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.xic,.aem{color:var(--ac)}.aem{display:flex;justify-content:center}.atile:not(.ok) .aem{color:var(--mu);opacity:.7}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
.in>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.in>*:nth-child(2){animation-delay:.05s}.in>*:nth-child(3){animation-delay:.1s}.in>*:nth-child(4){animation-delay:.15s}.in>*:nth-child(n+5){animation-delay:.2s}
.in .grid>div{animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}
.grid>div:nth-child(3n+2){animation-delay:.05s!important}.grid>div:nth-child(3n){animation-delay:.1s!important}
.grid>div,.card,.row{transition:transform .2s,box-shadow .2s}
.grid>div:active{transform:scale(.95)}
button{transition:transform .15s,background .25s,color .25s}button:active{transform:scale(.94)}
nav button svg{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}nav button.on svg{transform:translateY(-1px) scale(1.15)}
.fab{transition:transform .2s cubic-bezier(.3,1.5,.5,1)}.fab:active{transform:scale(.88) rotate(90deg)}
#modal.on{animation:fade .2s}#modal.on #sheet{animation:slide .35s cubic-bezier(.2,.9,.3,1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hub{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.hub button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:190px;border-radius:30px;border:1px solid var(--gb);background:color-mix(in srgb,var(--card) 55%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);color:var(--tx);font:inherit;box-shadow:0 10px 30px rgba(0,0,0,.08),inset 0 1px 0 var(--gb)}
.hub svg{width:58px;height:58px;stroke:var(--ac);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.hub b{font-family:"Alte Haas Regular",Outfit,sans-serif;font-weight:400;font-size:26px;letter-spacing:-.3px}
.hub span{color:var(--mu);font-size:13px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:14px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:pop .3s both;white-space:nowrap}
#cam{position:fixed;inset:0;z-index:100;background:#000;overflow:hidden;animation:fade .2s}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camfr{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5);background-size:cover;background-position:center}
.camhint{position:absolute;left:0;right:0;bottom:calc(138px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.camtop{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;justify-content:space-between}
.camb{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#222;display:flex;align-items:center;justify-content:center;padding:0}
.camb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cambar{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-around}
.shut{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:var(--ac);box-shadow:0 0 0 5px rgba(255,255,255,.35);padding:0}
.camt{padding:13px 24px;border-radius:26px;border:0;font:inherit;font-weight:600;background:rgba(255,255,255,.88);color:#222}.camt.ok{background:var(--ac);color:#fff}

.phead{display:flex;align-items:center;gap:14px;position:relative}.pid{flex:1;min-width:0;padding-right:112px}.phead .pname{margin-top:0;overflow-wrap:anywhere}.puser{overflow-wrap:anywhere}
.pdesc{position:relative;margin-top:14px;min-height:62px;padding-right:156px;font-size:14px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;opacity:.95}.pdesc.ph{opacity:.55;font-style:italic}
.pall{width:100%;margin:12px 0 4px;padding:12px}
.dragcl img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--bd);display:block}.dragcl.prod img{aspect-ratio:1/1;object-fit:contain;padding:8px;background:color-mix(in srgb,var(--card) 75%,transparent);border:1px solid var(--gb)}img.dragcl{object-fit:cover;border-radius:8px}
#modal:has(.cbk) #sheet{max-width:560px;max-height:88%;width:100%}
.cbk .bkh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.cbk .mgrid{margin-top:8px}.mgrid.prod{grid-template-columns:repeat(3,1fr)}.mgrid.prod img{aspect-ratio:1/1;object-fit:contain;padding:6px;background:color-mix(in srgb,var(--card) 75%,transparent);border:1px solid var(--gb)}
.mph{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:12px;color:var(--mu);border:1px dashed var(--bd);border-radius:8px;overflow:hidden}
#pubp{position:fixed;inset:0;z-index:9;background:var(--bg);overflow:auto;display:none;padding:max(12px,env(safe-area-inset-top)) 14px 40px}#pubp.on{display:block;animation:fade .2s}#pubp>div{max-width:640px;margin:0 auto}body.pubon nav,body.pubon .fab{display:none}.frow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;border:1px solid var(--gb);background:color-mix(in srgb,var(--card) 60%,transparent);margin:8px 0}.frow img,.frow .fav{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700}.prow{display:flex;gap:8px;margin:0 0 6px}.prow button{flex:1}
.bell{position:relative;overflow:visible}.bbadge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,.25)}.bbadge.on{display:flex;animation:pop .35s cubic-bezier(.2,.9,.3,1.4)}
.pact{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.pact .lk{margin-left:auto;display:flex;align-items:center;gap:6px}.lk svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.lk.on{color:#e5484d}.lk.on svg{fill:currentColor;transform:scale(1.15)}.lk[disabled]{opacity:.8}
.nsec{margin:14px 0 4px;font-weight:700;font-size:15px}.nrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;border:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 55%,transparent);margin:8px 0}.nrow img,.nrow .fav{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}.nrow .btns{display:flex;gap:6px;margin-top:6px}.nrow .btns button{padding:6px 12px;font-size:13px}
.pdesc.pdme{min-height:0;padding-right:0}
/* etiquetas especiales */
.utag{position:relative;display:inline-flex;vertical-align:middle}
.tgb{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 12px 4px 10px;font-size:12.5px;font-weight:700;letter-spacing:.2px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.75);animation:tgGlow 2.6s ease-in-out infinite}
.tgb::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg);animation:tgSweep 2.8s ease-in-out infinite}
.tg-cr .tgb{background:linear-gradient(135deg,#1f5fe0,#3aa0ff 55%,#7fd4ff);--gl:rgba(58,160,255,.85)}
.tg-cx .tgb{background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 68%,#000),var(--tc) 58%,color-mix(in srgb,var(--tc) 72%,#fff));--gl:color-mix(in srgb,var(--tc) 85%,transparent)}
.tg-lt .tgb{color:#222;text-shadow:none;border-color:rgba(0,0,0,.25)}
.tg-ad .tgb{background:linear-gradient(135deg,color-mix(in srgb,var(--g1) 72%,#000),var(--g2));--gl:color-mix(in srgb,var(--g2) 85%,transparent)}
.utag i{position:absolute;width:10px;height:10px;left:var(--x);top:var(--y);background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;transform:scale(0);animation:tgTw 2.4s var(--d) ease-in-out infinite;pointer-events:none}
@keyframes tgSweep{0%{left:-60%}55%,100%{left:130%}}
@keyframes tgTw{0%,100%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes tgGlow{0%,100%{box-shadow:0 0 6px var(--gl)}50%{box-shadow:0 0 15px 2px var(--gl)}}
@media(prefers-reduced-motion:reduce){.tgb,.tgb::after,.utag i{animation:none}.utag i{display:none}}
.ptags{display:contents}
.tgrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.tgrow .utag{flex:1}.tgrow button{flex:none}
.pme .phead{margin-top:40px}.pme .pid{padding-right:0}
.pbn{position:absolute;left:0;right:0;top:0;height:150px;background-size:cover;background-position:center;opacity:.75;-webkit-mask-image:linear-gradient(#000 20%,transparent);mask-image:linear-gradient(#000 20%,transparent);pointer-events:none}
.bcf{position:relative;width:100%;aspect-ratio:5/2;overflow:hidden;border-radius:14px;margin-top:12px;background:var(--bd);touch-action:none;cursor:grab}.bcf img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.bnprev{width:100%;aspect-ratio:5/2;border-radius:14px;background-size:cover;background-position:center;margin-bottom:10px;border:1px solid var(--bd)}
.psoc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;position:relative}
.psc{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:5px 12px 5px 9px;font-size:13px;font-weight:600;color:#fff;text-decoration:none;font-family:inherit;cursor:pointer}
.psc svg{width:16px;height:16px;flex:none}.psc.add{background:transparent;border-style:dashed;opacity:.9}

.sclab{display:flex;align-items:center;gap:8px;margin-top:12px}.sclab svg{width:20px;height:20px}
.plvx{margin:10px 0;border-radius:18px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:0 8px 20px color-mix(in srgb,var(--g1) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.45);cursor:pointer}
.lvbar{display:flex;align-items:center;gap:12px}.lvbn{font-size:15px;white-space:nowrap}.plvx .xpb{flex:1;height:10px}.lvbx{font-size:12px;opacity:.92;white-space:nowrap}.lvbc{font-size:20px;line-height:1;opacity:.85}
.swb.sbase{background-clip:padding-box;overflow:hidden;transform:translateZ(0)}
.swb.swadd{background:transparent;border:2px dashed var(--mu);color:var(--mu);font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:none}
.ccp{height:84px;border-radius:18px;margin:8px 0 10px;display:flex;align-items:flex-end;padding:10px 14px;color:#fff;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.ccr{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:10px;border:1px solid var(--bd);outline:none;margin:4px 0 8px;padding:0}
.ccr::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.35);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ccr::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.35)}
#cc_h{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#wel,#intro{position:fixed;inset:0;z-index:30;display:none;overflow:auto;background:var(--bg);color:var(--tx);padding:max(22px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom))}
#wel.on,#intro.on{display:block;animation:fade .25s}
.wbox{position:relative;z-index:1;max-width:420px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.wcard .seg{margin-bottom:6px}.wgo{width:100%;margin-top:14px;padding:13px 14px!important;font-size:16px}.wgo:disabled{opacity:.6}
.wmsg{min-height:18px;margin-top:10px;font-size:13px;color:#d6336c}.wmsg.ok{color:#2b8a3e}
.wlink{background:none;border:0;color:var(--mu);font:inherit;font-size:14px;text-decoration:underline;margin:18px auto 0;padding:8px}
.ibox{justify-content:space-between;gap:16px}.islide{flex:1;padding-top:18px}.ifoot{display:flex;flex-direction:column;gap:14px}
.idots{display:flex;gap:7px;justify-content:center}.idots i{width:8px;height:8px;border-radius:8px;background:var(--bd);transition:.25s}.idots i.on{width:24px;background:var(--ac)}

.wtt{margin:0 0 14px;font-weight:400;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center}
.wb1{font-family:"Morally Serif",Georgia,serif;font-size:clamp(22px,6.5vw,28px);line-height:1.1;color:var(--tx)}
.wb2{font-family:"Ham Is Cute","Alte Haas Regular",sans-serif;font-size:min(15vw,72px);line-height:1;color:var(--tx);margin-top:4px;white-space:nowrap}
.wbox{text-align:center}.wsub{color:var(--mu);font-size:15px;line-height:1.45;margin:0 auto 26px;max-width:300px}
.wcard{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
#wel .pri,#intro .pri{background:var(--ac)!important;box-shadow:none!important}
#wel .seg,#intro .seg{box-shadow:none}#wel .seg button.on,#intro .seg button.on{box-shadow:none}
.itt{font-family:"Morally Serif",Georgia,serif;font-weight:400;font-size:clamp(26px,8vw,32px);line-height:1.1;margin:0 0 8px;color:var(--tx);text-align:center}
.islide .wsub{margin-bottom:18px}.islide .xrow{text-align:left}
@keyframes wUp{from{opacity:0;transform:translateY(18px)}}
@keyframes wPop{from{opacity:0;transform:translateY(26px) scale(.55) rotate(-8deg)}}
@keyframes wBob{50%{transform:translateY(-3px)}}
@keyframes wShake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes wOut{to{opacity:0;transform:scale(1.03)}}
@keyframes wSw{from{opacity:0;transform:translateY(8px)}}
@keyframes wSpin{to{transform:rotate(360deg)}}
@keyframes iR{from{opacity:0;transform:translateX(26px)}}
.wb2>span{display:inline-block;animation:wBob 4.5s calc(var(--i)*.18s) ease-in-out infinite}
#wel.fx .wb2>span{animation:wPop .75s calc(.2s + var(--i)*.07s) both cubic-bezier(.34,1.56,.64,1),wBob 4.5s calc(1.3s + var(--i)*.18s) ease-in-out infinite}
#wel.fx .wb1{animation:wUp .7s .05s both cubic-bezier(.2,.8,.2,1)}
#wel.fx .wsub{animation:wUp .7s .5s both cubic-bezier(.2,.8,.2,1)}
#wel.fx .wcard{animation:wUp .7s .6s both cubic-bezier(.2,.8,.2,1)}
#wel.fx .wlink{animation:wUp .7s .75s both cubic-bezier(.2,.8,.2,1)}
#wel.out,#intro.out{animation:wOut .4s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
#wfx.wswap{animation:wSw .35s cubic-bezier(.2,.8,.2,1)}

const UNASSIGNED_GO_EXPENSE=Symbol();
function goExpenses(state){
 const buckets=new Map();
 const allItems=state.items.concat(state.col||[]);
 const itemsById=new Map(allItems.map(item=>[String(item.id),item]));
 const keyOf=item=>nrm((item?.go||"").trim());
 const names=new Map(allItems.filter(item=>keyOf(item)).map(item=>[keyOf(item),item.go.trim()]));
 const get=key=>{
  if(!buckets.has(key))buckets.set(key,{key,name:names.get(key),products:0,feeCents:{},charges:[]});
  return buckets.get(key);
 };
 const addFee=(bucket,kind,cents)=>{bucket.feeCents[kind]=(bucket.feeCents[kind]||0)+cents};
 for(const item of state.items)get(keyOf(item)).products+=Number(item.price)||0;
 for(const fee of state.cargos||[]){
  const cents=Math.round((Number(fee.amt)||0)*100);
  if(!cents)continue;
  const ids=[...new Set((fee.ids||[]).map(String))].sort();
  const shares=new Map();
  if(!ids.length)shares.set(UNASSIGNED_GO_EXPENSE,{cents,ids:[]});
  else{
   const perItem=Math.trunc(cents/ids.length);
   const remainder=cents%ids.length;
   ids.forEach((id,index)=>{
    const item=itemsById.get(id);
    const key=item?keyOf(item):UNASSIGNED_GO_EXPENSE;
    if(!shares.has(key))shares.set(key,{cents:0,ids:[]});
    const share=shares.get(key);
    share.cents+=perItem+(index<Math.abs(remainder)?Math.sign(remainder):0);
    share.ids.push(id);
   });
  }
  for(const [key,share] of shares){
   if(!share.cents)continue;
   const bucket=get(key);
   addFee(bucket,fee.kind,share.cents);
   bucket.charges.push({...fee,amt:share.cents/100,ids:share.ids});
  }
 }
 for(const box of Object.values(state.boxes||{})){
  const ship=Math.round((Number(box.ship)||0)*100);
  const customs=Math.round((Number(box.customs)||0)*100);
  if(ship)addFee(get(UNASSIGNED_GO_EXPENSE),"mx",ship);
  if(customs)addFee(get(UNASSIGNED_GO_EXPENSE),"adu",customs);
 }
 for(const row of buckets.values())row.fees=Object.values(row.feeCents).reduce((sum,cents)=>sum+cents,0)/100;
 return {groups:[...buckets.values()].filter(row=>row.name).sort((a,b)=>a.name.localeCompare(b.name,"es")),
  noGo:buckets.get(""),unassigned:buckets.get(UNASSIGNED_GO_EXPENSE)};
}

var vt=f=>{if(RM()||!document.startViewTransition)return f();try{document.startViewTransition(f)}catch(e){f()}};
var NVP=null,VDIR=0,SEGP={ctx:""},_ttl="",ti=t=>{const k=TABS.findIndex(x=>x[0]==t);return k<0?TABS.length:k};

 const pc=SEGP.ctx;_render();

 if(v.className=="in"){
  [...v.children].forEach((c,i)=>c.style.setProperty("--i",i));

 VDIR=0;
 v.querySelectorAll(".seg,.chips").forEach((e,i)=>{const o=sv[i],same=o&&pc==ctx;if(same)e.scrollLeft=o.sl;
  const b=e.querySelector("button.on");
  if(e.classList.contains("seg")&&b){e.classList.add("sp");const p=document.createElement("i");p.className="sgp";p.style.left=b.offsetLeft+"px";p.style.width=b.offsetWidth+"px";e.insertBefore(p,e.firstChild);
   if(same&&o.l!=null&&!rm&&p.animate&&(o.l!=b.offsetLeft||o.w!=b.offsetWidth))p.animate([{transform:`translateX(${o.l-b.offsetLeft}px)`,width:o.w+"px"},{transform:"translateX(0)",width:b.offsetWidth+"px"}],{duration:480,easing:"cubic-bezier(.34,1.3,.64,1)"})}
  if(same&&b&&e.scrollWidth>e.clientWidth)e.scrollTo({left:b.offsetLeft-(e.clientWidth-b.offsetWidth)/2,behavior:rm?"auto":"smooth"})});
 SEGP.ctx=ctx;
 const nav=$("nav"),nb=nav.querySelector("button.on");
 if(nb&&nb.offsetWidth>0){const p=document.createElement("i");p.className="nvp";p.style.left=nb.offsetLeft+"px";p.style.width=nb.offsetWidth+"px";nav.insertBefore(p,nav.firstChild);
  if(NVP&&!rm&&p.animate&&NVP.l!=nb.offsetLeft){const dx=NVP.l-nb.offsetLeft;p.animate([{transform:`translateX(${dx}px) scaleX(1)`},{transform:`translateX(${dx*.35}px) scaleX(1.16)`,offset:.5},{transform:"none"}],{duration:540,easing:"cubic-bezier(.3,1.15,.5,1)"});
   const sg=nb.querySelector("svg");if(sg&&sg.animate)sg.animate([{transform:"translateY(3px) scale(.7)"},{transform:"translateY(-3px) scale(1.3)",offset:.6},{transform:"translateY(-1px) scale(1.15)"}],{duration:520,easing:"ease-out"})}
  NVP={l:nb.offsetLeft,w:nb.offsetWidth}}
 const t=$("ttl");if(_ttl&&_ttl!==t.textContent&&!rm&&t.animate)t.animate([{opacity:0,transform:"translateY(-9px)"},{opacity:1,transform:"none"}],{duration:420,easing:"cubic-bezier(.2,.8,.2,1)"});_ttl=t.textContent};
function countUp(e){const t=e.textContent,n=parseFloat(t.replace(/[^0-9.\-]/g,""));if(!isFinite(n)||!n)return;const s=performance.now();(function f(now){const k=Math.min(1,(now-s)/900);if(k<1){e.textContent=money(n*(1-Math.pow(1-k,3)));requestAnimationFrame(f)}else e.textContent=t})(s)}
var _go=go,goB=0,goN=null;
go=function(t){if(RM()||!document.body.animate||t==tab){VDIR=0;return _go(t)}
 if(goB){goN=t;return}goB=1;const d=Math.sign(ti(t)-ti(tab))||1,a=$("v").animate([{opacity:1,transform:"none"},{opacity:0,transform:`translateX(${-d*22}px)`}],{duration:170,easing:"cubic-bezier(.4,0,1,1)",fill:"forwards"});
 a.onfinish=()=>{a.cancel();goB=0;const n=goN||t;goN=null;VDIR=Math.sign(ti(n)-ti(tab))||1;_go(n)}};
var _sg=setG;setG=function(k){anim=true;_sg(k)};
/* ventanas flotantes */
(function(){const M=$("modal"),SH=$("sheet");let cmT=0,lastH="";
 new MutationObserver(()=>{if(M.classList.contains("on")){if(!M._on){M._on=1;M.classList.add("fresh");setTimeout(()=>M.classList.remove("fresh"),900)}}else M._on=0}).observe(M,{attributes:true,attributeFilter:["class"]});

  const h=(SH.querySelector("h3")||{}).textContent||"";
  if(M._on&&!M.classList.contains("fresh")&&lastH&&h!==lastH&&!RM()&&SH.animate)SH.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:300,easing:"cubic-bezier(.2,.8,.2,1)"});
  lastH=h}).observe(SH,{childList:true});
 var _c=closeM;closeM=function(){
  if(M.classList.contains("closing")){clearTimeout(cmT);M.classList.remove("closing");return _c()}
  if(RM()||!M.classList.contains("on"))return _c();
  retBook=0;if(bkDirty){bkDirty=false;render()}
  M.classList.add("closing");clearTimeout(cmT);cmT=setTimeout(()=>{if(M.classList.contains("closing"))M.classList.remove("closing","on")},250)}})();
/* avisos */
toast=function(m){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.classList.add("out"),2300);setTimeout(()=>t.remove(),2650)};
/* perfil público */
(function(){const PB=$("pubp");let pT=0;var _cp=closePub,_op=openPub;
 closePub=function(){if(RM()||!PB.classList.contains("on")||PB.classList.contains("closing"))return _cp();
  PB.classList.add("closing");clearTimeout(pT);pT=setTimeout(()=>{PB.classList.remove("closing");_cp();[$("nav"),$("fab")].forEach(e=>e&&e.animate&&e.animate([{opacity:0,transform:"translateY(20px)"},{opacity:1,transform:"none"}],{duration:450,easing:"cubic-bezier(.2,.8,.2,1)"}))},280)};
 openPub=function(u){clearTimeout(pT);PB.classList.remove("closing");return _op(u)}})();
/* campana */

{let n=0,pd=false,tg=false;const t=setInterval(()=>{n++;if(n>40)return clearInterval(t);if(!(auth&&auth.user))return;if(!tg){tg=true;loadMyTags()}if(!pd&&S.profile&&S.profile.pub){pd=true;pubPush().then(()=>{pubMsg="Publicado "+hora()}).catch(e=>toast(e.message))}if(tg&&(pd||!(S.profile&&S.profile.pub)))clearInterval(t)},1500)}

/* ===== Novedades por versión =====
   Para una nueva actualización: sube APP_VER (ej. "1.18") y agrega una entrada al inicio de NEWS.
   Cada usuario verá solo las versiones posteriores a la última que ya vio. */
const APP_VER="1.23",VK="mypoca-ver";
/* Novedades locales (respaldo). Las que publiques desde la app (Ajustes > Publicar novedad) se leen de Supabase y no necesitan subir el archivo. */
const NEWS=[
 {v:"1.23",items:[["Envíos y aduanas por GO","Los cargos se reparten automáticamente entre los GOs de sus artículos vinculados."]]},
 {v:"1.22",items:[["Pestañas de Gastos por GO","Filtra tus gastos con las mismas pestañas brillantes de Pedidos."],["Fichas de GO","Las etiquetas anteriores también pueden abrir la descripción del GO socio."]]},
 {v:"1.21",items:[["Gastos por GO","Consulta el desglose usando tus pedidos y cargos guardados."],["GOs socios","Toca la etiqueta para ver la ficha del GO."],["@usuario único","Reserva tu nombre de usuario desde Editar perfil."]]},
  {v:"1.20",items:[["GO (group order)","Marca tus pedidos y artículos con su GO y filtra por pestañas con brillos."],["GOs no asociados","Si tu GO no es socio, agrégalo igual (sin brillo) o pide que el GOM envíe una solicitud."],["GOs socios","Busca tu GO en Editar perfil y agrégalo como etiqueta; toca la etiqueta para ver su información."]]},
 {v:"1.18",items:[["Banner y color en perfiles","Al entrar al perfil de alguien verás su banner y su color de tema."],["Etiquetas especiales","Creador, Primer usuario y Dearcupid gom, con brillos."],["Avisos de novedades","Verás aquí lo nuevo cada vez que haya una actualización."]]},
 {v:"1.17",items:[["Banners de perfil"],["Colores personalizados"],["Enlazar redes sociales al perfil"],["Página de inicio de sesión y tutoriales"]]}
];
const vNum=v=>String(v).split(".").map(n=>+n||0);
const vGt=(a,b)=>{const x=vNum(a),y=vNum(b);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0}return false};
let NEWSQ=null,newsTry=0,ALLN=NEWS.slice(),LATEST=APP_VER;
function markVer(){try{localStorage.setItem(VK,LATEST)}catch(e){}}
async function loadNews(){try{const r=await apiPub("novedades?select=version,items&order=created_at.desc&limit=30");r.forEach(x=>{if(!x.version||!Array.isArray(x.items))return;const e={v:String(x.version),items:x.items},k=ALLN.findIndex(n=>n.v==e.v);if(k>=0)ALLN[k]=e;else ALLN.push(e)})}catch(e){}
 ALLN.sort((a,b)=>vGt(a.v,b.v)?-1:vGt(b.v,a.v)?1:0);LATEST=ALLN[0].v}
async function initNews(){let seen=null;try{seen=localStorage.getItem(VK)}catch(e){return}
 await loadNews();
 if(seen===LATEST)return;
 const has=!!(auth||S.items.length||(S.col||[]).length||S.wish.length||S.cargos.length||S.envios.length||(S.profile&&S.profile.name));
 if(!seen&&!has){markVer();return}
 const list=ALLN.filter(n=>!seen||vGt(n.v,seen));
 if(!list.length){markVer();return}
 NEWSQ=list;setTimeout(tryNews,1100)}
function tryNews(){if(!NEWSQ)return;
 if(["wel","intro","modal","pubp"].some(i=>$(i).classList.contains("on"))){if(++newsTry<60)setTimeout(tryNews,1500);return}
 showNews()}
function showNews(list){list=list||NEWSQ||ALLN;NEWSQ=null;markVer();
 openM(`<div class="vw"><div class="nwb">v${esc(LATEST)}</div><h3 style="text-align:center;margin:0">¡Novedades en mypoca!</h3><div class="mu" style="text-align:center;margin:4px 0 8px">Esto es lo nuevo desde tu última visita:</div>${list.map(n=>(list.length>1?`<div class="nwv">v${esc(n.v)}</div>`:"")+n.items.map(it=>`<div class="xrow"><div class="xic">✦</div><div class="grow"><div class="xn">${esc(it[0])}</div>${it[1]?`<div class="xr">${esc(it[1])}</div>`:""}</div></div>`).join("")).join("")}<div style="margin-top:14px"><button class="pri" style="width:100%" onclick="closeM()">¡Entendido!</button></div></div>`)}
/* Publicar novedad (solo administrador) */
function editNews(){if(!isAdmin())return;const nx=vNum(LATEST);nx[nx.length-1]++;
 openM(`<h3>Publicar novedad</h3><div class="mu">Los usuarios la verán la próxima vez que abran la app.</div><label>Versión</label><input id="nw_v" value="${esc(nx.join("."))}"><label>Novedades (una por línea; usa | para separar título y detalle)</label><textarea id="nw_t" rows="6" placeholder="Etiquetas especiales | Ahora hay etiquetas con brillos\nNuevo diseño de perfil"></textarea><div style="display:flex;gap:8px;margin-top:14px"><button class="sec" style="flex:1" onclick="closeM()">Cancelar</button><button class="pri" style="flex:1" onclick="okNews()">Publicar</button></div>`)}
async function okNews(){const v=$("nw_v").value.trim(),items=$("nw_t").value.split("\n").map(l=>l.split("|").map(x=>x.trim()).filter(Boolean)).filter(a=>a.length).map(a=>a.slice(0,2));
 if(!/^\d+(\.\d+)*$/.test(v))return alert("La versión debe verse así: 1.19");if(!items.length)return alert("Escribe al menos una novedad.");
 try{await api("POST","novedades?on_conflict=version",[{version:v,items}],{Prefer:"resolution=merge-duplicates,return=minimal"});closeM();toast("Novedad v"+v+" publicada")}catch(e){alert("No se pudo publicar: "+e.message)}}
/* Aviso de versión nueva del archivo (recarga) */
let updT=0;async function chkUpd(){if(Date.now()-updT<60000||$("updbar"))return;updT=Date.now();
 try{const r=await fetch(location.origin+location.pathname+"?_="+Date.now(),{cache:"no-store"});if(!r.ok)return;const m=/const APP_VER="([\d.]+)"/.exec(await r.text());
  if(m&&vGt(m[1],APP_VER)){const b=document.createElement("button");b.id="updbar";b.textContent="Hay una versión nueva · Toca para actualizar";b.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ac);color:#fff;border:0;border-radius:22px;padding:11px 18px;font:inherit;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)";b.onclick=()=>location.reload();document.body.appendChild(b)}}catch(e){}}
setTimeout(chkUpd,8000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)chkUpd()});
/* GIFs deshabilitados */
async function stripGifs(){const p=S.profile;if(!p)return;let ch=false;for(const k of["photo","banner"]){if(isGif(p[k])){const o=await shrink(p[k],k=="banner"?1000:360);if(o){p[k]=o;ch=true}}}if(ch){save();render()}}
{const _ad=adopt;adopt=function(cd){_ad(cd);setTimeout(stripGifs,0)}}
setTimeout(stripGifs,600);
document.addEventListener("change",e=>{const t=e.target;if(t&&t.type=="file"&&t.files&&[...t.files].some(f=>f.type=="image/gif"||/\.gif$/i.test(f.name))){e.stopImmediatePropagation();e.preventDefault();t.value="";alert("Los GIF no están permitidos. Usa una imagen JPG, PNG o WebP.")}},true);
initNews();
