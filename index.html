<style>
:root{--bg:#EAF1FB;--card:#F6F9FF;--tx:#22344d;--mu:#6b84a3;--ac:#4f78b3;--bd:#D3E2F5;--ok:#2e9e6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131b2a;--card:#1e2a40;--tx:#e6eefb;--mu:#9fb4d1;--ac:#4f78b3;--bd:#2f405c;--ok:#4cc58f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131b2a;--card:#1e2a40;--tx:#e6eefb;--mu:#9fb4d1;--ac:#4f78b3;--bd:#2f405c;--ok:#4cc58f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:110px}
header{padding:14px 16px 4px}h1{margin:0;font-size:22px}
main{padding:8px 14px;max-width:640px;margin:auto}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;background:color-mix(in srgb,var(--card) 38%,transparent);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.5);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.2);border-radius:28px;padding:6px;z-index:5;max-width:616px;margin:auto}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0 6px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:10.5px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--tx);font-weight:600;background:color-mix(in srgb,var(--tx) 13%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.15)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:20px;padding:5px 12px;font:inherit;font-size:13px}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
h2{font-size:17px;margin:18px 0 4px}h3{font-size:15px;margin:0 0 6px}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.th{width:44px;height:60px;border-radius:6px;background:var(--bd);object-fit:cover;flex:none}
.grow{flex:1;min-width:0}.nm{font-weight:600;overflow-wrap:anywhere}.mu{color:var(--mu);font-size:12px}
.tag{font-size:11px;background:var(--bd);border-radius:20px;padding:1px 8px;margin-right:4px}
select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px;width:100%}
.chg{display:flex;gap:8px;margin:6px 0}.chg label{flex:1;font-size:12px;color:var(--mu)}
button.pri{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600}
button.sec{background:var(--bd);color:var(--tx);border:0;border-radius:10px;padding:10px 14px;font:inherit}
.fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;z-index:6;box-shadow:0 4px 14px #0004}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--bd)}
.big{font-size:30px;font-weight:800;color:var(--tx)}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--bd)}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}
#modal.on{display:flex}
#sheet{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}
#sheet label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px;width:100%;resize:vertical}
input,select,textarea{font-size:16px!important}html{overflow-x:hidden;-webkit-text-size-adjust:100%}body{touch-action:manipulation;overflow-x:hidden}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.ch{border:1px solid var(--bd);background:var(--bg);color:var(--mu);border-radius:20px;padding:5px 12px;font:inherit;font-size:13px}.ch.on{background:var(--ac);color:#fff;border-color:var(--ac)}.addr{display:flex;gap:6px}.addr .sec{padding:6px 14px}
body{font-family:Outfit,system-ui,-apple-system,sans-serif}
h1{font-family:"Jheri Curls",Parisienne,cursive;font-weight:400;font-size:44px;line-height:1.3;margin:0}h2{font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-weight:700;font-style:italic;font-size:28px;letter-spacing:.3px}
h3{font-family:Playball,Parisienne,cursive;font-weight:400;font-size:21px;letter-spacing:.2px}
.nm{font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-weight:700;font-size:19px;line-height:1.15}
.big{font-family:"Cormorant Garamond",Georgia,serif;font-size:46px;font-weight:700}
.empty{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-style:normal;font-size:22px;line-height:1.4}
.kv b{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px}
:root{--gb:rgba(255,255,255,.65)}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--gb:rgba(255,255,255,.14)}}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.6;animation:float 18s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:300px;height:300px;background:var(--o1);top:-60px;left:-80px}
.bgfx i:nth-child(2){width:260px;height:260px;background:var(--o2);top:38%;right:-90px;animation-delay:-6s}
.bgfx i:nth-child(3){width:280px;height:280px;background:var(--o3);opacity:.5;bottom:-80px;left:8%;animation-delay:-12s}
@keyframes float{to{transform:translate(40px,60px) scale(1.18)}}
.card{background:color-mix(in srgb,var(--card) 55%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--gb);box-shadow:0 8px 28px rgba(0,0,0,.08),inset 0 1px 0 var(--gb);border-radius:22px}
#sheet{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border-top:1px solid var(--gb);border-radius:26px 26px 0 0}
#modal{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button.pri,.btn{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 65%,#fff));box-shadow:0 6px 16px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.35)}
.btn{display:inline-block;color:#fff;border-radius:12px;padding:10px 14px;text-decoration:none;font-weight:600;font-size:14px}
button.sec{background:color-mix(in srgb,var(--bd) 70%,transparent);border:1px solid var(--gb)}
.chips button,.ch{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px}
.tag{display:inline-block;white-space:nowrap;margin:0!important;font-size:11px;padding:2px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chg{display:none!important}
nav{gap:0}nav button{font-size:10px}
.sg{margin:8px 0}.sg label{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px}.sg .sh{border-bottom:1px solid var(--bd)}.sg input{width:20px;height:20px;padding:0;accent-color:var(--ac);flex:none}
.pb{position:relative;height:6px;border-radius:6px;background:var(--bd);margin:20px 26px 34px}
.pb b{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--mu),var(--ac));animation:fill 1.2s cubic-bezier(.2,.8,.2,1) both}
.pb u{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--card);border:2px solid var(--bd);text-decoration:none;transition:.5s}
.pb u.on{background:var(--ac);border-color:var(--ac)}.pb u.cur{animation:pulse 1.8s infinite}
.pb u span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--mu);white-space:nowrap}
@keyframes fill{from{width:0}}@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 50%,transparent)}100%{box-shadow:0 0 0 12px transparent}}

h1{font-family:ARCO,Outfit,sans-serif;font-weight:400;font-size:40px;line-height:1.2;letter-spacing:-.5px}
h2{font-family:"Champagne Limousines",Outfit,sans-serif;font-weight:400;font-style:normal;font-size:26px;letter-spacing:.3px}
h3{font-family:"Alte Haas Regular",Outfit,sans-serif;font-weight:400;font-size:20px;letter-spacing:-.2px}
.nm{font-family:Vividly,Outfit,sans-serif;font-weight:400;font-size:21px;line-height:1.15}
.big,.empty,.kv b{font-family:Outfit,system-ui,sans-serif}.big{font-size:40px;font-weight:700}.empty{font-size:16px;font-weight:500}.kv b{font-size:15px;font-weight:600}
.seg{display:flex;gap:4px;padding:4px;border-radius:18px;background:color-mix(in srgb,var(--card) 50%,transparent);border:1px solid var(--gb);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);margin:8px 0 6px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px 10px;border-radius:14px;font:inherit;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--ac);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}.seg small{opacity:.7}
.ctags{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:4px}.ctag{font-size:9.5px;font-weight:600;padding:1px 7px;border-radius:20px;white-space:nowrap}

.avb{width:46px;height:46px;border-radius:50%;border:1px solid var(--gb);padding:0;overflow:hidden;background:color-mix(in srgb,var(--card) 60%,transparent);color:var(--mu);display:flex;align-items:center;justify-content:center;flex:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}.avb img{width:100%;height:100%;object-fit:cover}
header{display:flex;align-items:center;justify-content:space-between}
.pcard{position:relative;border-radius:28px;padding:22px 18px 18px;margin:10px 0;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:0 14px 34px color-mix(in srgb,var(--g1) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.5);overflow:hidden}
.pcard::before{content:"";position:absolute;top:-90px;right:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.25);filter:blur(30px)}
.pav{width:92px;height:92px;border-radius:50%;border:3px solid rgba(255,255,255,.75);overflow:hidden;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:36px;position:relative}.pav img{width:100%;height:100%;object-fit:cover}
.pedit{position:absolute;top:16px;right:16px;padding:8px 10px!important;color:#fff!important;background:rgba(255,255,255,.22)!important;border-color:rgba(255,255,255,.45)!important}
.pname{font-family:ARCO,Outfit,sans-serif;font-size:28px;margin-top:12px;position:relative}.puser{opacity:.88;font-size:15px;position:relative}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;position:relative}.pchip{background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600}.big2{background:rgba(15,40,90,.35)}

.sw{display:flex;gap:14px 12px;flex-wrap:wrap;margin-bottom:18px}.swi{display:flex;flex-direction:column;align-items:center;gap:6px;width:56px}.swi span{font-size:10.5px;color:var(--mu);white-space:nowrap}.pgear{right:64px!important}.swb{width:46px;height:46px;border-radius:50%;border:3px solid transparent;padding:0;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 8px rgba(0,0,0,.12)}.swb.on{border-color:var(--tx)}.swb span{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mu);white-space:nowrap}
#modal:has(.vw){align-items:center;justify-content:center;padding:22px}
#modal:has(.vw) #sheet{border-radius:28px;max-width:400px;max-height:84%;border:1px solid var(--gb);box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 1px 0 var(--gb);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)!important}
.grid.prod{grid-template-columns:repeat(2,1fr);gap:12px}.grid.prod img{aspect-ratio:1/1;object-fit:contain;padding:8px;background:color-mix(in srgb,var(--card) 75%,transparent);border:1px solid var(--gb)}
.grid>div,.mgrid img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.grid img,.mgrid img{-webkit-user-drag:none}
#modal:has(.fm) #sheet{max-width:440px;max-height:90%}
.pvbox{display:flex;align-items:center;justify-content:center;min-height:110px;border:2px dashed var(--bd);border-radius:18px;color:var(--mu);margin:10px 0 8px;background:color-mix(in srgb,var(--bg) 60%,transparent);padding:8px}.pvimg{max-height:170px;max-width:100%;border-radius:12px;display:block}
.sm{padding:6px 12px!important;font-size:13px}
.fs{background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--bd);border-radius:16px;padding:4px 12px 12px;margin:10px 0}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbar{position:sticky;bottom:-10px;display:flex;gap:8px;flex-wrap:wrap;padding:10px;margin-top:12px;border-radius:18px;border:1px solid var(--gb);background:color-mix(in srgb,var(--card) 92%,var(--bg));box-shadow:0 -6px 18px rgba(0,0,0,.07);z-index:2}
#sheet *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.tile{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--bd);display:flex;align-items:center;justify-content:center;border:2px solid transparent;transition:transform .2s,border-color .2s}.tile img{width:100%;height:100%;object-fit:cover}
.tile i{position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.8);border:1.5px solid var(--bd);transition:.2s}.tile.on{border-color:var(--ac);transform:scale(.93)}.tile.on i{background:var(--ac);border-color:var(--ac)}.tile.on i::after{content:"✓";color:#fff;font-size:11px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sgh{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px}.sgh .ch{padding:4px 10px;font-size:12px}
.plv{position:absolute;right:16px;top:122px;width:142px;text-align:right;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);border-radius:16px;padding:10px 12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:1}
.lvt{font-size:13px;font-weight:700;margin-bottom:6px}.xpb{height:8px;border-radius:8px;background:rgba(255,255,255,.3);overflow:hidden}.xpb b{display:block;height:100%;border-radius:8px;background:#fff;animation:fill 1.3s cubic-bezier(.2,.8,.2,1) both}.xpt{font-size:10.5px;opacity:.92;margin-top:5px}
.vw .xpb{background:var(--bd)}.vw .xpb b{background:linear-gradient(90deg,var(--mu),var(--ac))}.ach{margin:9px 0}.achh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.ach.ok .achh span{font-weight:700}
.lvhero{display:flex;gap:14px;align-items:center;margin:6px 0 16px}.lvring{--p:0;width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bd) 0);display:flex;align-items:center;justify-content:center;flex:none}
.lvring>div{width:68px;height:68px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}.lvring small{font-size:9px;letter-spacing:1px;color:var(--mu)}.lvring b{font-size:28px;font-weight:700;margin-top:2px}
.lvname{font-family:ARCO,Outfit,sans-serif;font-size:24px}
.xrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--bd);margin:8px 0}.xic{font-size:22px;width:34px;text-align:center;flex:none}.xn{font-weight:700;font-size:15px}.xr{font-size:12px;color:var(--mu);line-height:1.3}.xv{text-align:right;flex:none}.xv b{display:block;color:var(--ac);font-size:15px}.xv small{font-size:11px;color:var(--mu)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.atile{padding:10px;border-radius:16px;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--bd);text-align:center}.atile.ok{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}.aem{font-size:24px}.atile .an{font-size:12.5px;font-weight:600;margin:4px 0 6px}.atile small{display:block;font-size:10.5px;color:var(--mu);margin-top:5px}
.xic svg,.aem svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.xic,.aem{color:var(--ac)}.aem{display:flex;justify-content:center}.atile:not(.ok) .aem{color:var(--mu);opacity:.7}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
.in>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.in>*:nth-child(2){animation-delay:.05s}.in>*:nth-child(3){animation-delay:.1s}.in>*:nth-child(4){animation-delay:.15s}.in>*:nth-child(n+5){animation-delay:.2s}
.in .grid>div{animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}
.grid>div:nth-child(3n+2){animation-delay:.05s!important}.grid>div:nth-child(3n){animation-delay:.1s!important}
.grid>div,.card,.row{transition:transform .2s,box-shadow .2s}
.grid>div:active{transform:scale(.95)}
button{transition:transform .15s,background .25s,color .25s}button:active{transform:scale(.94)}
nav button svg{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}nav button.on svg{transform:translateY(-1px) scale(1.15)}
.fab{transition:transform .2s cubic-bezier(.3,1.5,.5,1)}.fab:active{transform:scale(.88) rotate(90deg)}
#modal.on{animation:fade .2s}#modal.on #sheet{animation:slide .35s cubic-bezier(.2,.9,.3,1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hub{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.hub button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:190px;border-radius:30px;border:1px solid var(--gb);background:color-mix(in srgb,var(--card) 55%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);color:var(--tx);font:inherit;box-shadow:0 10px 30px rgba(0,0,0,.08),inset 0 1px 0 var(--gb)}
.hub svg{width:58px;height:58px;stroke:var(--ac);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.hub b{font-family:ARCO,Outfit,sans-serif;font-weight:400;font-size:26px;letter-spacing:-.3px}
.hub span{color:var(--mu);font-size:13px}
